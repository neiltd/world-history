    <!-- Preloaded so all four registers (display, prose, apparatus, machine) request their preferred face immediately on first paint
         rather than only once something using it is first rendered (e.g. Story prose, which does
         not mount until a learner selects the Event) — otherwise that first render pays a
         font-swap reflow well after `document.fonts.ready` had already resolved for whatever was
         requested earlier. `crossorigin` is required on a font preload even same-origin (fetched
         in "anonymous" CORS mode per the Fetch spec, so the browser reuses this same request
         rather than issuing a second one for the `@font-face` in `fonts.css`). -->
    <link rel="preload" href="/world-history/fonts/InstrumentSerif-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
